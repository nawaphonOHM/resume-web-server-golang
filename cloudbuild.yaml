steps:
  # Step 1: Build the Docker image and push to the registry
  - name: 'docker.io/buildpacksio/pack'
    id: 'Build Image'
    args:
      - 'build'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$_SHORT_SHA'
      - '--builder=$_BUILDER'
      - '--network=cloudbuild'
      - '--publish'

  # Step 2: Deploy the container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy to Cloud Run'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$_SHORT_SHA'
      - '--region=$_LOCATION'
      - '--platform=managed'
      - '--service-account=$_SERVICE_ACCOUNT'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--network=default'
      - '--subnet=default'
      - '--vpc-egress=all-traffic'
      - '--startup-probe=httpGet.port=8080,httpGet.path=/health,timeoutSeconds=1,periodSeconds=10,failureThreshold=3'
      - '--set-secrets=OHM9996_MONGODB_AUTH_SOURCE=SINGLE_PAGE_APPLICATION_AUTH_SOURCE:1'
      - '--set-secrets=OHM9996_MONGODB_DATABASE=SINGLE_PAGE_APPLICATION_NOSQL_DATABASE_NAME:1'
      - '--set-secrets=OHM9996_MONGODB_HOST=SINGLE_PAGE_APPLICATION_NOSQL_DATABASE_URL:1'
      - '--set-secrets=OHM9996_MONGODB_MAX_CONN_IDLE_TIME=SINGLE_PAGE_APPLICATION_NOSQL_MAX_CONN_IDLE_TIME:1'
      - '--set-secrets=OHM9996_MONGODB_PASSWORD=SINGLE_PAGE_APPLICATION_NOSQL_PASSWORD:1'
      - '--set-secrets=OHM9996_MONGODB_PORT=SINGLE_PAGE_APPLICATION_NOSQL_PORT:1'
      - '--set-secrets=OHM9996_MONGODB_SOCKET_TIMEOUT=SINGLE_PAGE_APPLICATION_NOSQL_SOCKET_TIMEOUT:1'
      - '--set-secrets=OHM9996_MONGODB_USERNAME=SINGLE_PAGE_APPLICATION_NOSQL_USERNAME:1'
      - '--set-secrets=OHM9996_OTEL_ENABLED=RESUME_WEB_SERVER_GOLANG_OTEL_ENABLED:1'
      - '--set-secrets=OHM9996_SERVER_HOST=RESUME_WEB_SERVER_GOLANG_SERVER_HOST:1'
      - '--set-secrets=OHM9996_SERVER_PORT=RESUME_WEB_SERVER_GOLANG_SERVER_PORT:1'
      - '--set-secrets=OHM9996_LOGGING_FORMAT=RESUME_WEB_SERVER_GOLANG_LOGGING_FORMAT:1'
      - '--set-secrets=OHM9996_STORAGE_BUCKET=RESUME_SINGLE_PAGE_APPLICATION_CLOUD_STORAGE_BUCKET_NAME:1'
      - '--set-secrets=OHM9996_STORAGE_ENDPOINT=RESUME_SINGLE_PAGE_APPLICATION_CLOUD_STORAGE_BUCKET_URL:1'
      - '--set-secrets=OHM9996_STORAGE_REGION=RESUME_SINGLE_PAGE_APPLICATION_CLOUD_STORAGE_BUCKET_REGION:1'
      - '--set-secrets=OHM9996_STORAGE_ACCESS_KEY_ID=RESUME_WEB_SERVER_GOLANG_STORAGE_ACCESS_KEY:1'
      - '--set-secrets=OHM9996_STORAGE_SECRET_ACCESS_KEY=RESUME_WEB_SERVER_GOLANG_STORAGE_SECRET:1'
      - '--set-secrets=OHM9996_STORAGE_USE_PATH_STYLE=RESUME_WEB_SERVER_GOLANG_STORAGE_PATH_STYLE:1'
      - '--set-env-vars=OHM9996_CLOUD_PROVIDER=gcp'

options:
  logging: CLOUD_LOGGING_ONLY